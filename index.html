<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TrailShield</title>
  <style>
    body {
      margin: 0; min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #1f3d2b; color: #f1f5ee;
      font-family: sans-serif; text-align: center; padding: 20px;
    }
    h1 { font-size: 2.2rem; margin: 0; }
    p { opacity: 0.85; }
    button {
      background: #8fd18f; color: #12261a; border: none;
      font-size: 1.2rem; padding: 14px 32px;
      border-radius: 12px; margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>TRAILSHIELD</h1>
  <p>Your trail. Your data. Your device.</p>
  <button id="start">Start Trail</button>
  <p id="msg"></p>
  <script>
    document.getElementById("start").onclick = function () {
      document.getElementById("msg").textContent =
        "Trail started. Now put your phone away 📵";
    };
  </script>
</body>
</html>
